<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1510">
<title>Würfeltafel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@400;500;700&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8dbbd; --bg-deep:#dccca7; --ink:#2a2017; --ink-soft:#5d4b36;
  --gold:#7a561a; --gold-soft:#a7864d; --line:rgba(122,86,26,.35);
  --surface:rgba(122,86,26,.07); --surface-strong:rgba(122,86,26,.14);
  --red:#962e20; --red-soft:rgba(150,46,32,.12);
  --btn-ink:#f6ecd2;
  --texture:
    radial-gradient(ellipse at 20% 10%, rgba(255,250,235,.55), transparent 55%),
    radial-gradient(ellipse at 90% 100%, rgba(120,80,30,.18), transparent 60%),
    repeating-linear-gradient(177deg, rgba(90,60,20,.035) 0 1px, transparent 1px 9px);
  --serif:"Alegreya", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --caps:"Alegreya SC", "Alegreya", Georgia, serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1510; --bg-deep:#130f0b; --ink:#eadcb8; --ink-soft:#b3a27e;
    --gold:#dcbd6e; --gold-soft:#8e7845; --line:rgba(220,189,110,.28);
    --surface:rgba(0,0,0,.28); --surface-strong:rgba(220,189,110,.09);
    --red:#d0624f; --red-soft:rgba(208,98,79,.14);
    --btn-ink:#1b1510;
    --texture:
      radial-gradient(ellipse at 50% -10%, rgba(255,214,140,.07), transparent 60%),
      repeating-linear-gradient(179deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(181.5deg, rgba(0,0,0,.22) 0 1px, transparent 1px 14px),
      repeating-linear-gradient(178deg, rgba(0,0,0,.12) 0 3px, transparent 3px 41px);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1510; --bg-deep:#130f0b; --ink:#eadcb8; --ink-soft:#b3a27e;
  --gold:#dcbd6e; --gold-soft:#8e7845; --line:rgba(220,189,110,.28);
  --surface:rgba(0,0,0,.28); --surface-strong:rgba(220,189,110,.09);
  --red:#d0624f; --red-soft:rgba(208,98,79,.14);
  --btn-ink:#1b1510;
  --texture:
    radial-gradient(ellipse at 50% -10%, rgba(255,214,140,.07), transparent 60%),
    repeating-linear-gradient(179deg, rgba(255,255,255,.018) 0 2px, transparent 2px 7px),
    repeating-linear-gradient(181.5deg, rgba(0,0,0,.22) 0 1px, transparent 1px 14px),
    repeating-linear-gradient(178deg, rgba(0,0,0,.12) 0 3px, transparent 3px 41px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;
  background-color:var(--bg);background-image:var(--texture);
  color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
input{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg{display:block}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:var(--caps);font-weight:500;font-size:1.35rem;color:var(--gold);line-height:1.1;display:flex;align-items:center;gap:6px}
.brand p{margin:0;font-size:.85rem;color:var(--ink-soft)}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line)}
.icon-btn:active{background:var(--surface-strong)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.bar{display:flex;gap:10px;padding:10px 14px 12px;border-top:1px solid var(--line);background:var(--bg-deep)}

.ornament{color:var(--gold);opacity:.85}
h2{font-family:var(--caps);font-weight:500;color:var(--gold);font-size:1.5rem;margin:4px 0 2px;display:flex;align-items:center;gap:8px}
h3{font-family:var(--caps);font-weight:500;color:var(--gold);font-size:1.12rem;margin:22px 0 8px}
.lead{color:var(--ink-soft);margin:0 0 14px}

/* Buttons */
.btn{flex:1;min-height:52px;border-radius:6px;padding:10px 14px;font-family:var(--caps);font-size:1.08rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--gold);color:var(--gold)}
.btn:active:not(:disabled){background:var(--surface-strong)}
.btn.primary{background:var(--gold);color:var(--btn-ink)}
.btn.primary:active:not(:disabled){filter:brightness(1.1)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:active:not(:disabled){background:var(--red-soft)}
.btn.small{min-height:42px;font-size:.98rem;flex:0 0 auto}
.link-btn{color:var(--gold);font-family:var(--caps);font-size:1rem;padding:8px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}

/* Setup */
.field{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.field .num{width:28px;color:var(--gold-soft);font-family:var(--caps);text-align:center}
.text-in{flex:1;min-width:0;height:48px;border-radius:6px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:1.05rem}
.text-in::placeholder{color:var(--ink-soft);opacity:.7}
.rm{width:40px;height:40px;border-radius:50%;color:var(--ink-soft);display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:72px;height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);font-size:1.05rem;font-variant-numeric:lining-nums tabular-nums}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--btn-ink);border-color:var(--gold)}
.custom-target{display:flex;gap:8px;align-items:center;margin-top:10px}
.custom-target .text-in{max-width:160px}

/* Scoreboard */
.board{display:flex;flex-direction:column;gap:6px}
.prow{width:100%;text-align:left;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:4px 10px;padding:10px 12px;border-radius:6px;border:1px solid transparent;background:var(--surface)}
.prow.cur{border-color:var(--gold);background:var(--surface-strong)}
.prow .mark{color:var(--gold);display:grid;place-items:center}
.prow .nm{font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tot{font-size:1.3rem;font-weight:700;color:var(--gold);font-variant-numeric:lining-nums tabular-nums;text-align:right}
.prow .pend{font-size:.85rem;color:var(--ink-soft);font-weight:400;margin-right:6px}
.prog{grid-column:2 / 4;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:2px;transition:width .5s ease}

/* Turn */
.turn{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.turn-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.turn-head .who{font-family:var(--caps);color:var(--gold);font-size:1.25rem;line-height:1.2}
.turn-head .who small{display:block;font-family:var(--serif);font-size:.85rem;color:var(--ink-soft)}
.turn-sum{font-size:2.6rem;font-weight:700;line-height:1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums;text-align:right}
.turn-sum.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.12);color:var(--gold)}}
.free{display:flex;align-items:center;gap:8px;margin:10px 0 4px;color:var(--ink-soft);font-size:.9rem}
.free .slots{display:flex;gap:3px}
.free .slots span{width:12px;height:12px;border-radius:3px;border:1.5px solid var(--gold-soft)}
.free .slots span.on{background:var(--gold);border-color:var(--gold)}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--surface)}
.log .dice{display:flex;gap:3px;flex:1;flex-wrap:wrap}
.log .pts{font-weight:700;color:var(--gold);font-variant-numeric:lining-nums tabular-nums}
.log .hot{font-size:.8rem;color:var(--ink-soft);font-style:italic;width:100%}

.pad-title{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.pad-title span{font-family:var(--caps);color:var(--gold);font-size:1.05rem}
.pad-title small{color:var(--ink-soft);font-size:.85rem}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pad button{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;color:var(--gold);background:var(--surface);border:1px solid var(--line)}
.pad button:active:not(:disabled){background:var(--surface-strong);transform:scale(.94)}
.pad button svg{width:82%;height:82%}
.tray{margin-top:10px;min-height:64px;border-radius:8px;border:1px dashed var(--gold-soft);padding:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tray .slot{width:40px;height:40px;color:var(--gold)}
.tray .slot.empty{border-radius:6px;border:1px dashed var(--line)}
.tray .slot svg{width:100%;height:100%}
.tray .hint{color:var(--ink-soft);font-size:.92rem;padding:0 4px}
.eval{margin:8px 2px 0;min-height:1.4em;font-size:.95rem;color:var(--ink-soft)}
.eval b{color:var(--gold);font-size:1.1rem}
.eval.bad{color:var(--red)}
.row-btns{display:flex;gap:8px;margin-top:10px}
details.manual{margin-top:14px}
details.manual summary{color:var(--ink-soft);font-size:.92rem;cursor:pointer;list-style:none;padding:6px 0}
details.manual summary::-webkit-details-marker{display:none}
details.manual summary::before{content:"+ "}
details.manual[open] summary::before{content:"– "}
details.manual .custom-target{margin-top:4px}

.over-card{margin-top:18px;border:1px solid var(--gold);border-radius:8px;padding:16px;text-align:center;background:var(--surface-strong)}
.over-card .crown{color:var(--gold);display:flex;justify-content:center;margin-bottom:4px}
.over-card h2{justify-content:center;margin:0}
.over-card p{margin:4px 0 0;color:var(--ink-soft)}

/* Modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,7,4,.62);
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{max-width:560px;width:100%;margin:0 auto;max-height:100%;display:flex;flex-direction:column;
  background-color:var(--bg);background-image:var(--texture);border-top:1px solid var(--gold-soft);border-radius:14px 14px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.sheet-head h2{flex:1;margin:0;font-size:1.4rem}
.sheet-body{overflow-y:auto;padding:4px 16px 22px}
.combo{display:flex;align-items:center;gap:10px;padding:5px 0}
.combo .dice{display:flex;gap:4px}
.combo .dice svg{width:32px;height:32px;color:var(--gold)}
.combo .dice svg.extra{color:var(--ink)}
.combo .val{font-size:1.25rem;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;margin:8px 0;color:var(--ink-soft)}
.note svg{width:32px;height:32px;flex:0 0 auto;color:var(--gold)}
.combo-grid h3:first-child{margin-top:8px}
.rules p{margin:0 0 10px}
.hist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.hist li{border-radius:6px;background:var(--surface);padding:8px 10px}
.hist .h-top{display:flex;justify-content:space-between;gap:8px}
.hist .h-top b{font-variant-numeric:lining-nums tabular-nums;color:var(--gold)}
.hist .h-top b.bust{color:var(--red)}
.hist .h-dice{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.88rem;color:var(--ink-soft)}
.hist .h-dice span{display:flex;align-items:center;gap:2px}
.hist .h-dice svg{width:20px;height:20px;color:var(--gold)}
.mini-die{width:24px;height:24px;color:var(--gold)}
.empty{color:var(--ink-soft);font-style:italic}
.rank{list-style:none;padding:0;margin:12px 0 0;text-align:left}
.rank li{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line);font-variant-numeric:lining-nums tabular-nums}
.rank li:first-child{color:var(--gold);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);z-index:60;
  background:var(--gold);color:var(--btn-ink);padding:10px 16px;border-radius:22px;font-size:.95rem;box-shadow:0 6px 20px rgba(0,0,0,.35);
  animation:toast 2.6s ease forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<script>
(function(){
"use strict";
const KEY="wuerfeltafel-v1", HKEY="wuerfeltafel-hist-v1";
const TARGETS=[1500,2000,3000,4000,5000,8000];

/* ---------- Icons ---------- */
const PIPS={1:[[20,20]],2:[[27.5,12.5],[12.5,27.5]],3:[[27.5,12.5],[20,20],[12.5,27.5]],
  4:[[12.5,12.5],[27.5,12.5],[12.5,27.5],[27.5,27.5]],5:[[12.5,12.5],[27.5,12.5],[20,20],[12.5,27.5],[27.5,27.5]],
  6:[[13,11.5],[13,20],[13,28.5],[27,11.5],[27,20],[27,28.5]]};
function die(v,cls){
  const frame='<rect x="2" y="2" width="36" height="36" rx="6" fill="none" stroke="currentColor" stroke-opacity=".55" stroke-width="1.6"/><rect x="5" y="5" width="30" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>';
  let inner;
  if(v===7){
    inner='<g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M13.5 16 Q10 12 12 7.5 Q13.5 11.5 16.5 13"/><path d="M26.5 16 Q30 12 28 7.5 Q26.5 11.5 23.5 13"/>'+
      '<path d="M14 15.5 Q20 11 26 15.5 Q27.5 21 25 25.5 Q22.5 31 20 32.5 Q17.5 31 15 25.5 Q12.5 21 14 15.5Z"/>'+
      '<path d="M16.3 19.5 L18.6 20.6"/><path d="M23.7 19.5 L21.4 20.6"/><path d="M17.8 26 Q20 27.6 22.2 26"/><path d="M20 22 L20 24"/></g>';
  } else {
    inner=PIPS[v].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.6" fill="currentColor"/>').join('');
  }
  return '<svg viewBox="0 0 40 40" class="'+(cls||'')+'" aria-hidden="true">'+frame+inner+'</svg>';
}
const ICON={
  undo:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  book:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 11.5h5"/></svg>',
  menu:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>',
  close:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  arrow:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l10 7-10 7z"/></svg>',
  crown:'<svg width="40" height="28" viewBox="0 0 40 28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M5 22 3 7l9 7 8-11 8 11 9-7-2 15z"/><path d="M5 25.5h30"/><circle cx="20" cy="15" r="2" fill="currentColor"/></svg>',
  crownS:'<svg width="18" height="14" viewBox="0 0 40 28" fill="currentColor"><path d="M5 22 3 7l9 7 8-11 8 11 9-7-2 15z"/></svg>',
  flourish:'<svg class="ornament" width="44" height="22" viewBox="0 0 44 22" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 14c8 0 10-8 17-8 6 0 7 7 2 7-4 0-3-5 1-4"/><path d="M19 6c3-4 9-5 12-2 3 2 1 6-2 5"/><path d="M24 13c5 1 9-1 11-4 2 4 5 5 7 4"/><path d="M30 9c1 3 4 6 9 5"/><circle cx="12" cy="9" r="1" fill="currentColor"/></svg>'
};

/* ---------- Scoring ---------- */
const memo=new Map();
function solve(c){
  const k=c.join(',');
  if(memo.has(k)) return memo.get(k);
  const total=c[1]+c[2]+c[3]+c[4]+c[5]+c[6];
  if(total===0){const r={s:0,parts:[]};memo.set(k,r);return r;}
  let best={s:-Infinity,parts:[]};
  const tryOpt=(rem,pts,label)=>{const r=solve(rem);if(r.s+pts>best.s)best={s:r.s+pts,parts:[{label,pts}].concat(r.parts)};};
  const take=(faces)=>{const r=c.slice();faces.forEach(f=>r[f]--);return r;};
  if([1,2,3,4,5,6].every(f=>c[f]>=1)) tryOpt(take([1,2,3,4,5,6]),1500,"Straße 1–6");
  if([1,2,3,4,5].every(f=>c[f]>=1)) tryOpt(take([1,2,3,4,5]),500,"Straße 1–5");
  if([2,3,4,5,6].every(f=>c[f]>=1)) tryOpt(take([2,3,4,5,6]),750,"Straße 2–6");
  for(let f=1;f<=6;f++){
    for(let n=3;n<=c[f];n++){
      const r=c.slice();r[f]-=n;
      tryOpt(r,(f===1?1000:f*100)*Math.pow(2,n-3),n+"× "+f);
    }
  }
  if(c[1]>=1){const r=c.slice();r[1]--;tryOpt(r,100,"Eine 1");}
  if(c[5]>=1){const r=c.slice();r[5]--;tryOpt(r,50,"Eine 5");}
  memo.set(k,best);return best;
}
function evaluate(dice){
  if(!dice.length) return null;
  const c=[0,0,0,0,0,0,0];let j=0;
  dice.forEach(d=>{if(d===7)j++;else c[d]++;});
  let best={s:-Infinity,parts:[]};
  (function assign(left,minF){
    if(!left){const r=solve(c);if(r.s>best.s)best=r;return;}
    for(let f=minF;f<=6;f++){c[f]++;assign(left-1,f);c[f]--;}
  })(j,1);
  return best.s>0?best:null;
}

/* ---------- State ---------- */
function fresh(names,target){
  return {phase:"setup",setupNames:names&&names.length?names:["",""],target:target||4000,customTarget:"",
    players:[],current:0,turn:{entries:[],diceLeft:6},turns:[],winner:null};
}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function store(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(HKEY,JSON.stringify(hist.slice(-40)));}catch(e){}}
let S=load(KEY)||fresh();
let hist=load(HKEY)||[];
let sel=[], modal=null, bumpTurn=false;

function commit(fn){hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();fn();store();render();}
const turnSum=()=>S.turn.entries.reduce((a,e)=>a+e.points,0);
const fmt=n=>n.toLocaleString("de-DE");
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2700);}

/* ---------- Actions ---------- */
const A={
  addField(){S.setupNames.push("");store();render();focusLast();},
  rmField(i){S.setupNames.splice(+i,1);if(!S.setupNames.length)S.setupNames.push("");store();render();},
  target(v){S.target=+v;S.customTarget="";store();render();},
  start(){
    const names=S.setupNames.map((n,i)=>n.trim()||("Spieler "+(i+1)));
    let t=S.target;const ct=parseInt(S.customTarget,10);if(ct>0)t=ct;
    if(!t||t<50){toast("Lege zuerst ein Punkteziel fest");return;}
    commit(()=>{S.phase="play";S.target=t;S.players=names.map(n=>({name:n,total:0}));S.current=0;
      S.turn={entries:[],diceLeft:6};S.turns=[];S.winner=null;});
    sel=[];
  },
  pick(v){if(S.phase!=="play"||sel.length>=S.turn.diceLeft)return;sel.push(+v);buzz(8);render();},
  unpick(i){sel.splice(+i,1);render();},
  clearSel(){sel=[];render();},
  addSel(){
    const r=evaluate(sel);if(!r)return;
    const dice=sel.slice();sel=[];bumpTurn=true;
    let hot=false;
    commit(()=>{S.turn.diceLeft-=dice.length;if(S.turn.diceLeft<=0){S.turn.diceLeft=6;hot=true;}
      S.turn.entries.push({dice,points:r.s,parts:r.parts,hot});});
    if(hot){toast("Alle Würfel haben gepunktet – wieder sechs im Becher");buzz([20,40,20]);}
  },
  addManual(){
    const inp=document.getElementById("manual-in");const n=parseInt(inp&&inp.value,10);
    if(!n||n<=0){toast("Gib eine Punktzahl größer als 0 ein");return;}
    bumpTurn=true;commit(()=>{S.turn.entries.push({dice:[],points:n,parts:[{label:"Von Hand",pts:n}],manual:true});});
  },
  bank(){
    const sum=turnSum();if(!sum)return;sel=[];
    commit(()=>{
      const p=S.players[S.current];p.total+=sum;
      S.turns.push({p:S.current,res:"bank",points:sum,entries:S.turn.entries});
      S.turn={entries:[],diceLeft:6};
      if(p.total>=S.target){S.phase="over";S.winner=S.current;modal={type:"win"};}
      else S.current=(S.current+1)%S.players.length;
    });
    buzz(15);
  },
  bust(){
    const lost=turnSum();sel=[];
    commit(()=>{S.turns.push({p:S.current,res:"bust",points:lost,entries:S.turn.entries});
      S.turn={entries:[],diceLeft:6};S.current=(S.current+1)%S.players.length;});
    buzz([40,60,40]);toast(lost?fmt(lost)+" Punkte verloren":"Busted – nächster Spieler");
  },
  undo(){if(!hist.length)return;S=JSON.parse(hist.pop());sel=[];modal=null;store();render();toast("Rückgängig gemacht");},
  rules(){modal={type:"rules"};renderModal();},
  player(i){modal={type:"player",i:+i};renderModal();},
  menu(){modal={type:"menu"};renderModal();},
  showWin(){modal={type:"win"};renderModal();},
  close(){modal=null;renderModal();},
  newGame(){modal=null;sel=[];const names=S.players.length?S.players.map(p=>p.name):S.setupNames;const t=S.target;
    commit(()=>{S=fresh(names.slice(),TARGETS.includes(t)?t:4000);if(!TARGETS.includes(t))S.customTarget=String(t);});}
};
function focusLast(){const f=document.querySelectorAll(".text-in.name");if(f.length)f[f.length-1].focus();}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b||b.disabled)return;
  if(b.dataset.a==="backdrop"&&e.target!==b)return;
  if(b.dataset.a==="backdrop"){A.close();return;}
  A[b.dataset.a]&&A[b.dataset.a](b.dataset.v);
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.classList.contains("name")){S.setupNames[+t.dataset.i]=t.value;store();}
  if(t.id==="custom-target"){S.customTarget=t.value;store();
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",(!t.value&&+c.dataset.v===S.target)?"true":"false"));}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.classList.contains("name")){e.preventDefault();A.addField();}
  if(e.key==="Escape"&&modal)A.close();
});

/* ---------- Render ---------- */
const app=document.getElementById("app");
function render(){
  const m=app.querySelector("main");const st=m?m.scrollTop:0;
  app.innerHTML=S.phase==="setup"?viewSetup():viewGame();
  const nm=app.querySelector("main");if(nm)nm.scrollTop=st;
  if(bumpTurn){const t=app.querySelector(".turn-sum");if(t)t.classList.add("bump");bumpTurn=false;}
  renderModal();
}

function header(sub,withGameBtns){
  return '<header class="top"><div class="brand"><h1>Würfeltafel '+ICON.flourish+'</h1><p>'+sub+'</p></div>'+
    (withGameBtns?'<button class="icon-btn" data-a="undo" aria-label="Rückgängig"'+(hist.length?'':' disabled')+'>'+ICON.undo+'</button>':'')+
    '<button class="icon-btn" data-a="rules" aria-label="Punktekombinationen">'+ICON.book+'</button>'+
    (withGameBtns?'<button class="icon-btn" data-a="menu" aria-label="Menü">'+ICON.menu+'</button>':'')+'</header>';
}

function viewSetup(){
  const fields=S.setupNames.map((n,i)=>'<div class="field"><span class="num">'+(i+1)+'</span>'+
    '<input class="text-in name" data-i="'+i+'" value="'+esc(n)+'" placeholder="Spieler '+(i+1)+'" autocomplete="off" enterkeyhint="next" maxlength="24">'+
    '<button class="rm" data-a="rmField" data-v="'+i+'" aria-label="Spieler entfernen">'+ICON.x+'</button></div>').join('');
  const chips=TARGETS.map(t=>'<button class="chip" data-a="target" data-v="'+t+'" aria-pressed="'+(!S.customTarget&&S.target===t)+'">'+fmt(t)+'</button>').join('');
  return header("Punkte zählen am Würfeltisch",false)+
  '<main><h2>Neue Partie</h2><p class="lead">Trag die Spieler in der Reihenfolge ein, in der sie würfeln.</p>'+
  fields+'<button class="link-btn" data-a="addField">Spieler hinzufügen</button>'+
  '<h3>Punkte zum Sieg</h3><div class="chips">'+chips+'</div>'+
  '<div class="custom-target"><input id="custom-target" class="text-in" type="number" inputmode="numeric" min="50" step="50" placeholder="Eigenes Ziel" value="'+esc(S.customTarget||"")+'"></div>'+
  '</main><div class="bar"><button class="btn primary" data-a="start">Partie beginnen</button></div>';
}

function viewGame(){
  const sum=turnSum(),over=S.phase==="over";
  const rows=S.players.map((p,i)=>{
    const cur=!over&&i===S.current,win=over&&i===S.winner;
    const pct=Math.min(100,p.total/S.target*100);
    return '<button class="prow'+(cur||win?' cur':'')+'" data-a="player" data-v="'+i+'" aria-label="'+esc(p.name)+', '+p.total+' Punkte – Verlauf ansehen">'+
      '<span class="mark">'+(win?ICON.crownS:cur?ICON.arrow:'')+'</span><span class="nm">'+esc(p.name)+'</span>'+
      '<span class="tot">'+(cur&&sum?'<span class="pend">+'+fmt(sum)+'</span>':'')+fmt(p.total)+'</span>'+
      '<span class="prog"><i style="width:'+pct+'%"></i></span></button>';
  }).join('');
  let body='<div class="board">'+rows+'</div>';
  if(over){
    const w=S.players[S.winner];
    body+='<div class="over-card"><div class="crown">'+ICON.crown+'</div><h2>'+esc(w.name)+' gewinnt</h2>'+
      '<p>Mit '+fmt(w.total)+' von '+fmt(S.target)+' Punkten. Tippe auf einen Spieler, um seine Züge zu sehen.</p></div>';
  } else body+=viewTurn(sum);
  const bar=over
    ?'<div class="bar"><button class="btn" data-a="showWin">Ergebnis</button><button class="btn primary" data-a="newGame">Neue Partie</button></div>'
    :'<div class="bar"><button class="btn danger" data-a="bust">Busted</button><button class="btn primary" data-a="bank"'+(sum?'':' disabled')+'>Sichern'+(sum?' +'+fmt(sum):'')+'</button></div>';
  return header("Ziel: "+fmt(S.target)+" Punkte",true)+'<main>'+body+'</main>'+bar;
}

function viewTurn(sum){
  const p=S.players[S.current],left=S.turn.diceLeft;
  const slots=Array.from({length:6},(_,i)=>'<span class="'+(i<left-sel.length?'on':'')+'"></span>').join('');
  const log=S.turn.entries.map(e=>'<li><span class="dice">'+(e.manual?'<span class="empty">von Hand</span>':e.dice.map(d=>die(d,"mini-die")).join(''))+
    '</span><span class="pts">+'+fmt(e.points)+'</span>'+(e.hot?'<span class="hot">Alle sechs gepunktet, neu würfeln</span>':'')+'</li>').join('');
  const r=evaluate(sel);
  let ev='';
  if(sel.length){
    ev=r?'<p class="eval">'+r.parts.map(x=>x.label).join(' + ')+' = <b>'+fmt(r.s)+'</b>'+(sel.includes(7)?' (mit Teufelskopf)':'')+'</p>'
        :'<p class="eval bad">Keine gültige Wertung – jeder gehaltene Würfel muss punkten.</p>';
  } else ev='<p class="eval"></p>';
  const traySlots=sel.map((d,i)=>'<button class="slot" data-a="unpick" data-v="'+i+'" aria-label="Würfel entfernen">'+die(d)+'</button>').join('')+
    (sel.length?'':'<span class="hint">Tippe oben die Würfel an, die '+esc(p.name)+' zur Seite legt.</span>');
  const full=sel.length>=left;
  const pad=[1,2,3,4,5,6,7].map(v=>'<button data-a="pick" data-v="'+v+'" aria-label="'+(v===7?'Teufelskopf (Joker)':'Würfel '+v)+'"'+(full?' disabled':'')+'>'+die(v)+'</button>').join('');
  return '<section class="turn"><div class="turn-head"><div class="who">'+esc(p.name)+'<small>ist am Zug</small></div>'+
    '<div class="turn-sum" aria-live="polite">'+fmt(sum)+'</div></div>'+
    '<div class="free"><span class="slots">'+slots+'</span>'+(left-sel.length)+' von 6 Würfeln im Becher</div>'+
    (log?'<ul class="log">'+log+'</ul>':'')+
    '<div class="pad-title"><span>Gehaltene Würfel</span><small>max. '+left+'</small></div>'+
    '<div class="pad">'+pad+'</div><div class="tray">'+traySlots+'</div>'+ev+
    '<div class="row-btns"><button class="btn small" data-a="clearSel"'+(sel.length?'':' disabled')+'>Leeren</button>'+
    '<button class="btn primary" data-a="addSel"'+(r?'':' disabled')+'>Wertung hinzufügen'+(r?' +'+fmt(r.s):'')+'</button></div>'+
    '<details class="manual"><summary>Punkte von Hand eintragen</summary><div class="custom-target">'+
    '<input id="manual-in" class="text-in" type="number" inputmode="numeric" min="1" step="50" placeholder="z. B. 350">'+
    '<button class="btn small" data-a="addManual">Eintragen</button></div></details></section>';
}

/* ---------- Modals ---------- */
const mroot=document.getElementById("modal-root");
function sheet(title,body){
  return '<div class="modal" data-a="backdrop" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="sheet">'+
    '<div class="sheet-head"><h2>'+title+'</h2><button class="icon-btn" data-a="close" aria-label="Schließen">'+ICON.close+'</button></div>'+
    '<div class="sheet-body">'+body+'</div></div></div>';
}
function combo(dice,val,extraFrom){
  return '<div class="combo"><span class="dice">'+dice.map((d,i)=>die(d,extraFrom!=null&&i>=extraFrom?'extra':'')).join('')+'</span><span class="val">'+fmt(val)+'</span></div>';
}
function rulesBody(){
  return '<div class="combo-grid">'+
    '<h3>Einzelne Würfel und Straßen</h3>'+
    combo([1],100)+combo([5],50)+combo([1,2,3,4,5],500)+combo([2,3,4,5,6],750)+combo([1,2,3,4,5,6],1500)+
    '<div class="note">'+die(7)+'<span>Der Teufelskopf ist ein Joker und zählt als jede beliebige Augenzahl, die eine Kombination vervollständigt.</span></div>'+
    '<h3>Drei Gleiche</h3>'+
    combo([1,1,1],1000)+combo([2,2,2],200)+combo([3,3,3],300)+combo([4,4,4],400)+combo([5,5,5],500)+combo([6,6,6],600)+
    '<h3>Jeder weitere gleiche Würfel verdoppelt</h3>'+
    combo([2,2,2,2],400,3)+combo([2,2,2,2,2],800,3)+combo([2,2,2,2,2,2],1600,3)+
    '</div><h3>Ablauf eines Zuges</h3><div class="rules">'+
    '<p>Wer dran ist, wirft alle sechs Würfel und muss mindestens einen punktenden Würfel zur Seite legen. Jeder beiseitegelegte Würfel muss zu einer Wertung gehören, und Kombinationen zählen nur, wenn sie in einem einzigen Wurf fallen.</p>'+
    '<p>Danach entscheidet der Spieler: mit den restlichen Würfeln weiterwerfen oder die gesammelten Punkte sichern. Haben alle sechs Würfel gepunktet, darf er wieder mit allen sechs werfen.</p>'+
    '<p>Bringt ein Wurf keinen einzigen punktenden Würfel, ist der Spieler „busted“: alle Punkte dieses Zuges sind verloren und der Nächste ist dran. Wer zuerst das Punkteziel erreicht, gewinnt.</p>'+
    '<p>In der App: Würfel antippen, „Wertung hinzufügen“, und am Ende „Sichern“ oder „Busted“. Mit dem Pfeil oben machst du jeden Schritt rückgängig.</p></div>';
}
function playerBody(i){
  const p=S.players[i];if(!p)return '';
  const mine=S.turns.map((t,n)=>({t,n})).filter(x=>x.t.p===i);
  const banked=mine.filter(x=>x.t.res==="bank").length,busts=mine.length-banked;
  let html='<p class="lead">'+fmt(p.total)+' Punkte aus '+banked+' gesicherten '+(banked===1?'Zug':'Zügen')+(busts?', '+busts+'× busted':'')+'.</p>';
  if(!mine.length) return html+'<p class="empty">Noch keine Züge.</p>';
  let round=0;
  html+='<ul class="hist">'+mine.map(x=>{round++;const t=x.t;
    const parts=t.entries.map(e=>'<span>'+(e.manual?'von Hand':e.dice.map(d=>die(d)).join(''))+'&nbsp;'+fmt(e.points)+'</span>').join('');
    return '<li><div class="h-top"><span>Zug '+round+'</span>'+(t.res==="bank"?'<b>+'+fmt(t.points)+'</b>':'<b class="bust">Busted'+(t.points?' (−'+fmt(t.points)+')':'')+'</b>')+'</div>'+
      (parts?'<div class="h-dice">'+parts+'</div>':'')+'</li>';}).reverse().join('')+'</ul>';
  return html;
}
function winBody(){
  const w=S.players[S.winner];
  const ranked=S.players.map(p=>p).sort((a,b)=>b.total-a.total);
  return '<div class="over-card" style="margin-top:0"><div class="crown">'+ICON.crown+'</div><h2>'+esc(w.name)+' gewinnt</h2><p>'+fmt(w.total)+' Punkte – Ziel war '+fmt(S.target)+'.</p></div>'+
    '<ol class="rank">'+ranked.map(p=>'<li><span>'+esc(p.name)+'</span><span>'+fmt(p.total)+'</span></li>').join('')+'</ol>'+
    '<div class="row-btns" style="margin-top:18px"><button class="btn" data-a="close">Tafel ansehen</button><button class="btn primary" data-a="newGame">Neue Partie</button></div>';
}
function menuBody(){
  return '<p class="lead">Eine neue Partie übernimmt die Spielernamen. Die aktuelle Partie lässt sich danach mit dem Pfeil wiederherstellen.</p>'+
    '<div class="row-btns"><button class="btn" data-a="close">Abbrechen</button><button class="btn primary" data-a="newGame">Neue Partie</button></div>';
}
function renderModal(){
  if(!modal){mroot.innerHTML="";return;}
  let h="";
  if(modal.type==="rules") h=sheet("Punktekombinationen",rulesBody());
  else if(modal.type==="player") h=sheet(esc((S.players[modal.i]||{}).name||""),playerBody(modal.i));
  else if(modal.type==="win"&&S.winner!=null) h=sheet("Partie beendet",winBody());
  else if(modal.type==="menu") h=sheet("Neue Partie beginnen?",menuBody());
  mroot.innerHTML=h;
}

render();
})();
</script>
</body>
</html>
